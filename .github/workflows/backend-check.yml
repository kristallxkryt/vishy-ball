name: Backend checks

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  backend-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Use a clean test database
        run: rm -f *.db *.sqlite *.sqlite3

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Import application and verify core routes
        run: |
          python - <<'PY'
          from main import app
          from checking_routes import grade_assignment_attempt
          from auth_routes import router as auth_router
          from classes_routes import router as classes_router
          from variants_routes import router as variants_router

          print("Auth router routes:", len(auth_router.routes), [getattr(route, "path", None) for route in auth_router.routes])
          print("Classes router routes:", len(classes_router.routes), [getattr(route, "path", None) for route in classes_router.routes])
          print("Variants router routes:", len(variants_router.routes), [getattr(route, "path", None) for route in variants_router.routes])
          print("App route objects:", [(type(route).__name__, getattr(route, "path", None)) for route in app.routes])

          required_paths = {
              "/api/auth/register",
              "/api/auth/login",
              "/api/profile/progress",
              "/api/admin/analytics/overview",
              "/api/admin/analytics/students",
              "/api/classes",
              "/api/classes/join",
              "/api/variants",
              "/api/assignments",
              "/api/assignments/{assignment_id}/start",
              "/api/assignments/{assignment_id}/submit",
          }

          registered_paths = set(app.openapi()["paths"])
          print("Registered API paths:", sorted(registered_paths))

          missing = required_paths - registered_paths
          assert not missing, f"Missing API routes: {sorted(missing)}"
          assert callable(grade_assignment_attempt)

          print(f"Application imported successfully; {len(registered_paths)} routes registered.")

      - name: Run API integration tests
        run: pytest -q
          PY
