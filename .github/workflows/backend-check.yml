name: Backend checks

on:
  push:
    branches:
      - main
      - development
      - frontend/design-foundation
      - 'frontend/**'
  pull_request:
    branches:
      - main
      - development

jobs:
  backend-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Audit committed SQLite databases
        run: python scripts/audit_sqlite.py

      - name: Verify startup migrations against existing database
        run: |
          python - <<'PY'
          import sqlite3
          from main import app

          connection = sqlite3.connect("users.db")
          try:
              integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
              foreign_key_issues = connection.execute("PRAGMA foreign_key_check").fetchall()
              assert integrity == "ok", integrity
              assert not foreign_key_issues, foreign_key_issues
              print(f"Existing database migrated successfully; {len(app.openapi()['paths'])} API routes registered.")
          finally:
              connection.close()
          PY

      - name: Use a clean test database
        run: rm -f *.db *.sqlite *.sqlite3

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Import application and verify core routes
        run: |
          python - <<'PY'
          from main import app
          from checking_routes import grade_assignment_attempt

          required_paths = {
              "/api/auth/register",
              "/api/auth/login",
              "/api/profile/progress",
              "/api/admin/analytics/overview",
              "/api/admin/analytics/students",
              "/api/classes",
              "/api/classes/join",
              "/api/variants",
              "/api/assignments",
              "/api/assignments/{assignment_id}/start",
              "/api/assignments/{assignment_id}/submit",
              "/api/mock-exams/{subject_code}",
              "/api/mock-exams/{subject_code}/generate",
              "/api/mock-exams/attempts/{attempt_id}/submit",
          }

          registered_paths = set(app.openapi()["paths"])
          missing = required_paths - registered_paths
          assert not missing, f"Missing API routes: {sorted(missing)}"
          assert callable(grade_assignment_attempt)

          print(f"Application imported successfully; {len(registered_paths)} routes registered.")
          PY

      - name: Run API integration tests
        run: pytest -q
